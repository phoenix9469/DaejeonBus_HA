# 노선으로 조회 대시보드 카드
# 필요한 HACS 프런트엔드: Mushroom (piitaya/lovelace-mushroom), button-card (custom-cards/button-card)
# 사용법: 대시보드 편집 → 카드 추가 → 수동 → 아래 전체를 붙여넣기
#   'daejeon_bus_commute_213_31770' 을 내 항목의 엔티티 이름으로 바꾸세요 (찾아 바꾸기).
type: vertical-stack
cards:
  # ── 1. 출발 안내 ──────────────────────────────────────────────
  - type: custom:mushroom-template-card
    entity: sensor.daejeon_bus_commute_213_31770
    primary: >-
      {{ state_attr(entity, '노선번호') }}번 → {{ state_attr(entity, '내 정류장') }}
    secondary: >-
      {{ states(entity) }}
    icon: >-
      {% set s = states(entity) %}
      {% if s == '지금 출발' %}mdi:run-fast
      {% elif '후 출발' in s %}mdi:walk
      {% elif '놓침' in s %}mdi:bus-alert
      {% else %}mdi:bus-clock{% endif %}
    icon_color: >-
      {% set s = states(entity) %}
      {% if s == '지금 출발' %}red
      {% elif '후 출발' in s %}green
      {% elif '놓침' in s %}orange
      {% else %}grey{% endif %}
    badge_icon: >-
      {{ 'mdi:alert-circle' if is_state('binary_sensor.daejeon_bus_commute_213_31770_leave_now', 'on') }}
    badge_color: red
    fill_container: true
    multiline_secondary: true
    tap_action:
      action: perform-action
      perform_action: button.press
      target:
        entity_id: button.daejeon_bus_commute_213_31770_refresh

  # ── 2. 요약 칩 ────────────────────────────────────────────────
  - type: custom:mushroom-chips-card
    alignment: center
    chips:
      - type: template
        icon: mdi:bus-clock
        icon_color: blue
        content: >-
          {{ states('sensor.daejeon_bus_commute_213_31770_first_minutes')
             | replace('unknown', '도착정보 없음') }}
      - type: template
        icon: mdi:map-marker-distance
        icon_color: blue
        content: >-
          {% set n = states('sensor.daejeon_bus_commute_213_31770_first_stops') %}
          {{ n ~ '정류장 전' if n not in ['unknown', 'unavailable'] else '-' }}
      - type: template
        icon: mdi:walk
        icon_color: green
        content: >-
          도보 {{ state_attr('sensor.daejeon_bus_commute_213_31770', '도보 시간(분)') | int(0) }}분
      - type: template
        icon: mdi:update
        content: >-
          {% set t = states('sensor.daejeon_bus_commute_213_31770_last_update') %}
          {% if t in ['unknown', 'unavailable'] %}-
          {% else %}{% set m = ((as_timestamp(now()) - as_timestamp(t)) / 60) | int %}
          {{ '방금 조회' if m < 1 else m ~ '분 전 조회' }}{% endif %}
      - type: action
        icon: mdi:refresh
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.daejeon_bus_commute_213_31770_refresh

  # ── 3. 오고 있는 버스 (진행 막대) ──────────────────────────────
  - type: custom:button-card
    entity: sensor.daejeon_bus_commute_213_31770
    show_name: false
    show_icon: false
    show_state: false
    tap_action:
      action: none
    variables:
      max_rows: 5        # 보여줄 버스 수
      scale_stops: 30    # 막대 길이 기준 (이 정류장 수 이상이면 막대가 가장 짧음)
    styles:
      card:
        - padding: 12px 16px
      grid:
        - grid-template-areas: '"list"'
      custom_fields:
        list:
          - justify-self: stretch
          - text-align: left
    custom_fields:
      list: |
        [[[
          const buses = (entity && entity.attributes['버스 목록']) || [];
          const maxRows = variables.max_rows;
          const scale = variables.scale_stops;
          if (!buses.length) {
            return `<div style="color:var(--secondary-text-color);padding:8px 0">오고 있는 버스가 없습니다</div>`;
          }
          const rows = buses.slice(0, maxRows).map((b, i) => {
            const stops = b['남은 정류장'];
            const km = (b['남은 거리(m)'] / 1000).toFixed(1);
            // 가까울수록 막대가 길어짐 (내 정류장 = 오른쪽 끝)
            const pct = Math.max(6, Math.round(100 - Math.min(stops, scale) / scale * 100));
            const near = stops <= 3;
            const color = i === 0 ? (near ? 'var(--error-color, #db4437)' : 'var(--primary-color)')
                                  : 'var(--secondary-text-color)';
            const eta = b['도착예정시간']
              ? `<span style="font-weight:600;color:${color}">${b['도착예정시간']}</span>` : '';
            return `
              <div style="margin:10px 0">
                <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
                  <span style="font-weight:600;color:var(--primary-text-color)">
                    ${i + 1}번째 · ${stops}정류장 전
                    <span style="font-weight:400;color:var(--secondary-text-color)">(${km}km)</span>
                  </span>
                  ${eta}
                </div>
                <div style="position:relative;height:8px;margin:6px 0 4px;border-radius:4px;
                            background:var(--divider-color, rgba(127,127,127,.2))">
                  <div style="position:absolute;left:0;top:0;bottom:0;width:${pct}%;border-radius:4px;
                              background:${color};opacity:${i === 0 ? 1 : .55}"></div>
                  <ha-icon icon="mdi:bus-side" style="position:absolute;top:-9px;left:calc(${pct}% - 13px);
                            --mdc-icon-size:22px;color:${color}"></ha-icon>
                </div>
                <div style="font-size:12px;color:var(--secondary-text-color)">
                  현재 ${b['현재 정류장']} · ${b['차량번호']}
                </div>
              </div>`;
          }).join('');
          const more = buses.length > maxRows
            ? `<div style="font-size:12px;color:var(--secondary-text-color)">외 ${buses.length - maxRows}대</div>` : '';
          return `<div style="font-size:14px">${rows}${more}</div>`;
        ]]]
